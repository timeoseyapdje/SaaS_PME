const C = {
  bg: "#09090b", white: "#fafafa", muted: "#a1a1aa", emerald: "#10b981", emeraldDark: "#047857",
  amber: "#f59e0b", red: "#ef4444", card: "#18181b", border: "#27272a", mtn: "#ffcc00", orange: "#ff7900",
};
const FONT = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3);
const easeBack = (x) => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const prog = (t, start, dur) => clamp((t - start) / dur);
function sceneAlpha(t, s, e, f = 0.4) { return clamp(Math.min((t - s) / f, (e - t) / f)); }
const fcfa = (n) => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " FCFA";

function text(str, x, y, { size = 72, weight = 700, color = C.white, align = "center", alpha = 1 } = {}) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = `${weight} ${size}px ${FONT}`;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = "middle";
  ctx.fillText(str, x, y);
  ctx.restore();
}

function rrect(x, y, w, h, r, fill, stroke) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 3; ctx.stroke(); }
}

function slideIn(t, start, fn, dy = 60) {
  const p = easeOut(prog(t, start, 0.6));
  if (p <= 0) return;
  ctx.save();
  ctx.globalAlpha *= p;
  ctx.translate(0, (1 - p) * dy);
  fn();
  ctx.restore();
}

function drawBackground(t) {
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, W, H);
  const gx = W / 2 + Math.sin(t * 0.4) * 220, gy = 700 + Math.cos(t * 0.3) * 260;
  const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, 900);
  g.addColorStop(0, "rgba(16,185,129,0.22)");
  g.addColorStop(1, "rgba(16,185,129,0)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  const g2 = ctx.createRadialGradient(W, H, 0, W, H, 900);
  g2.addColorStop(0, "rgba(245,158,11,0.12)");
  g2.addColorStop(1, "rgba(245,158,11,0)");
  ctx.fillStyle = g2;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "rgba(255,255,255,0.05)";
  for (let x = 30; x < W; x += 60) for (let y = 30; y < H; y += 60) ctx.fillRect(x, y, 3, 3);
}

function brandBar(alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  rrect(W / 2 - 170, 120, 64, 64, 14, "#fff");
  if (logo.complete) ctx.drawImage(logo, W / 2 - 166, 124, 56, 56);
  text("Nkap Control", W / 2 + 40, 153, { size: 40, weight: 700 });
  ctx.restore();
}

// Scène 1 — accroche
function scene1(t) {
  slideIn(t, 0.2, () => {
    text("Vos factures", W / 2, 700, { size: 104 });
    text("encore sur Word ?", W / 2, 830, { size: 104 });
  });
  slideIn(t, 2.0, () => {
    text("Vos paiements MoMo", W / 2, 1060, { size: 84, color: C.amber });
    text("perdus dans le téléphone ?", W / 2, 1170, { size: 84, color: C.amber });
  });
}

// Scène 2 — douleurs
function scene2(t) {
  slideIn(t, 4.6, () => text("Résultat :", W / 2, 560, { size: 96 }));
  const items = ["Factures oubliées", "Clients qui paient en retard", "Aucune visibilité sur la caisse"];
  items.forEach((label, i) => {
    const s = 5.3 + i * 0.75;
    const p = easeBack(prog(t, s, 0.5));
    if (p <= 0) return;
    const y = 820 + i * 220;
    ctx.save();
    ctx.globalAlpha *= clamp(p);
    ctx.translate(W / 2, y);
    ctx.scale(0.8 + 0.2 * p, 0.8 + 0.2 * p);
    rrect(-440, -80, 880, 160, 28, "rgba(239,68,68,0.10)", "rgba(239,68,68,0.45)");
    ctx.strokeStyle = C.red; ctx.lineWidth = 10; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-370, -26); ctx.lineTo(-318, 26); ctx.moveTo(-318, -26); ctx.lineTo(-370, 26); ctx.stroke();
    text(label, -280, 0, { size: 52, weight: 600, align: "left" });
    ctx.restore();
  });
}

// Scène 3 — révélation de la marque
function scene3(t) {
  const p = easeBack(prog(t, 8.7, 0.8));
  ctx.save();
  ctx.translate(W / 2, 760);
  ctx.scale(p, p);
  ctx.shadowColor = "rgba(16,185,129,0.6)"; ctx.shadowBlur = 80;
  rrect(-150, -150, 300, 300, 60, "#fff");
  ctx.shadowBlur = 0;
  if (logo.complete) ctx.drawImage(logo, -130, -130, 260, 260);
  ctx.restore();
  slideIn(t, 9.4, () => text("Nkap Control", W / 2, 1080, { size: 120, weight: 800 }));
  slideIn(t, 10.1, () => {
    text("La gestion financière pensée", W / 2, 1230, { size: 56, weight: 500, color: C.muted });
    text("pour les PME camerounaises", W / 2, 1305, { size: 56, weight: 500, color: C.emerald });
  });
}

function invoiceCard(t, x, y, countStart, paidAt) {
  const w = 840, h = 900;
  rrect(x, y, w, h, 36, C.card, C.border);
  text("FACTURE", x + 60, y + 90, { size: 44, weight: 800, align: "left" });
  text("FAC-2026-0142", x + w - 60, y + 90, { size: 34, weight: 600, color: C.muted, align: "right" });
  text("Client : Boutique Ndolo, Douala", x + 60, y + 170, { size: 32, weight: 500, color: C.muted, align: "left" });
  text("NIU M0123456789X · RCCM RC/DLA/2024/B/1234", x + 60, y + 220, { size: 26, weight: 500, color: "#71717a", align: "left" });
  ctx.fillStyle = C.border; ctx.fillRect(x + 60, y + 270, w - 120, 3);
  const lines = [["Ciment 50 kg × 40", 240000], ["Fer à béton × 20", 180000], ["Livraison", 80000]];
  lines.forEach(([l, v], i) => {
    const a = easeOut(prog(t, countStart - 1.2 + i * 0.3, 0.4));
    text(l, x + 60, y + 340 + i * 75, { size: 34, weight: 500, align: "left", alpha: a });
    text(fcfa(v), x + w - 60, y + 340 + i * 75, { size: 34, weight: 600, align: "right", alpha: a });
  });
  ctx.fillStyle = C.border; ctx.fillRect(x + 60, y + 560, w - 120, 3);
  const k = easeOut(prog(t, countStart, 1.4));
  text("Total HT", x + 60, y + 630, { size: 34, weight: 500, color: C.muted, align: "left" });
  text(fcfa(500000 * k), x + w - 60, y + 630, { size: 34, weight: 600, align: "right" });
  text("TVA 19,25 %", x + 60, y + 695, { size: 34, weight: 500, color: C.muted, align: "left" });
  text(fcfa(96250 * k), x + w - 60, y + 695, { size: 34, weight: 600, align: "right" });
  text("Total TTC", x + 60, y + 790, { size: 46, weight: 800, align: "left" });
  text(fcfa(596250 * k), x + w - 60, y + 790, { size: 46, weight: 800, color: C.emerald, align: "right" });

  if (paidAt !== undefined) {
    const s = easeBack(prog(t, paidAt, 0.5));
    if (s > 0) {
      ctx.save();
      ctx.translate(x + w - 220, y + 450);
      ctx.rotate(-0.22);
      ctx.scale(2 - s, 2 - s);
      ctx.globalAlpha *= clamp(s);
      ctx.strokeStyle = C.emerald; ctx.lineWidth = 10;
      ctx.beginPath(); ctx.roundRect(-170, -62, 340, 124, 18); ctx.stroke();
      text("PAYÉE", 0, 4, { size: 78, weight: 900, color: C.emerald });
      ctx.restore();
    }
  }
}

const scenes = [
  [0, 4.5, scene1], [4.5, 8.5, scene2], [8.5, 12.5, scene3],
  [12.5, 19, scene4], [19, 24.5, scene5], [24.5, DURATION + 1, scene6],
];

function render(t) {
  drawBackground(t);
  for (const [s, e, fn] of scenes) {
    if (t < s || t > e) continue;
    ctx.save();
    ctx.globalAlpha = sceneAlpha(t, s, e);
    fn(t);
    ctx.restore();
  }
  if (t > 4.5) brandBar(clamp((t - 4.5) / 0.5) * (t < 8.5 || t > 12.5 ? 1 : 0));
  ctx.fillStyle = C.emerald;
  ctx.fillRect(0, H - 10, W * clamp(t / DURATION), 10);
}

let startTs = performance.now();
let loop = true;
function frame(now) {
  const t = (now - startTs) / 1000;
  if (loop) render(t % DURATION); else render(Math.min(t, DURATION));
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

document.getElementById("replay").onclick = () => { startTs = performance.now(); };

document.getElementById("export").onclick = async () => {
  const btn = document.getElementById("export");
  const status = document.getElementById("status");
  const types = ["video/mp4;codecs=avc1.640028", "video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm"];
  const mimeType = types.find((m) => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
  if (!mimeType) { status.textContent = "Ce navigateur ne permet pas l'export. Utilisez Chrome."; return; }
  btn.disabled = true;
  const stream = cv.captureStream(30);
  const rec = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 12_000_000 });
  const chunks = [];
  rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  rec.onstop = () => {
    const ext = mimeType.startsWith("video/mp4") ? "mp4" : "webm";
    const url = URL.createObjectURL(new Blob(chunks, { type: mimeType.split(";")[0] }));
    const a = document.createElement("a");
    a.href = url; a.download = `nkap-control-pub.${ext}`; a.click();
    status.textContent = `Vidéo exportée (${ext.toUpperCase()}).` + (ext === "webm" ? " Convertissez-la en MP4 avec CapCut ou cloudconvert si la plateforme refuse le WebM." : "");
    btn.disabled = false; loop = true;
  };
  loop = false;
  startTs = performance.now();
  rec.start(500);
  const tick = setInterval(() => {
    const left = Math.max(0, DURATION - (performance.now() - startTs) / 1000);
    status.textContent = `Enregistrement… ${Math.ceil(left)} s`;
  }, 250);
  setTimeout(() => { clearInterval(tick); rec.stop(); }, DURATION * 1000 + 300);
};
</script>
